spring:
  application:
    name: healthcare-api-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
#      Checks whether your Java entities match the existing database schema.

  flyway:
    enabled: true
    out-of-order: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

bootstrap:
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    organization-name: ${BOOTSTRAP_ORG_NAME}
    organization-code: ${BOOTSTRAP_ORG_CODE}
jwt:
  secret: ${JWT_SECRET}

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${S3_BUCKET}
    multipart:
      enabled: true
      threshold: 100MB
      minimum-part-size: 10MB

server:
  port: 9000
logging:
  level:
    org.springframework.security: DEBUG