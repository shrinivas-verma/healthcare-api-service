spring:
  application:
    name: healthcare-api-service
  datasource:
    url: jdbc:postgresql://localhost:5433/healthcare
    username: postgres
    password: Admin@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      email: ${BOOTSTRAP_ADMIN_EMAIL}
      organization-name: ${BOOTSTRAP_ORG_NAME}
      organization-code: ${BOOTSTRAP_ORG_CODE}